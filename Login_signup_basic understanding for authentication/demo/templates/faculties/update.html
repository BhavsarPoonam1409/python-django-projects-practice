<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Update a Faculties</h2>

    <form method="post">

        {% csrf_token %}
        
        <input type="text" value="{{facusers.fullname}}" name="fullname" placeholder="Enter your name "> <br> <br>
        <input type="text" value="{{facusers.mobile}}" name="mobile" placeholder="Enter your age "> <br> <br>
        <input type="text" value="{{facusers.email}}" name="email" placeholder="Enter your Mobile "> <br> <br>
        <input type="text" value="{{facusers.age}}" name="age" placeholder="Enter your Gender "> <br> <br>

        <input type="submit">
    </form>
</body>
</html>
