<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Update users</h1>
    <form action="" method="post">
        {% csrf_token %}
        Image:
        <input type="text" name="image" value="{{updateuser.image}}" placeholder="Enter a image"><br><br>

        Name:
        <input type="text"  name="name" value="{{updateuser.name}}" placeholder="Enter a name"><br><br>

        Age:
        <input type="text" name="age" value="{{updateuser.age}}" placeholder="Enter a age "><br><br>

        Number:
        <input type="text" name="number" value="{{updateuser.number}}" placeholder="Enter a number "><br><br>

        Gender:
        <input type="text" name="gender" value="{{updateuser.gender}}" placeholder="Enter a gender"><br><br>

        <input type="submit" name="submit">
    </form>
</body>
</html>
